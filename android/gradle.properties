# Cap Gradle heap & use low-overhead GC
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC -XX:SoftRefLRUPolicyMSPerMB=0

# Limit concurrency (prevents 12 workers from exhausting RAM)
org.gradle.parallel=false
org.gradle.workers.max=2

# Release RAM 1 minute after build ends
org.gradle.daemon.idletimeout=60000

# Disable in-memory file watching daemon cache
org.gradle.vfs.watch=false

# Cap Kotlin compiler daemon
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m

# Android & Tooling Settings
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
